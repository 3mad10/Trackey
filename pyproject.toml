[project]
name = "trackey"
version = "0.1.0"
requires-python = ">=3.10"


dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "Pillow==11.0.0",
    "PyYAML==6.0.2",
    "pydantic>=2.0.0",
    "requests==2.32.3",
    "scipy==1.14.1",
    "prometheus-client>=0.20.0",
    "python-json-logger>=2.0.0",
]

[project.scripts]
trackey = "trackey.cli:main"

[project.optional-dependencies]
detection = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "ultralytics==8.3.40",
]
tracking = [
    "trackey[detection]",
    "deep-sort-realtime==1.3.2",
]
reid = [
    "trackey[tracking]",
    "yacs==0.1.8",
    # torchreid is installed by scripts/install.sh using --no-build-isolation
    # because its old setup.py requires numpy at build time.
]
face = [
    "mediapipe==0.10.21",
    "insightface==0.7.3",
    "onnx==1.17.0",
    "onnxruntime-gpu==1.20.1",
]
postgres = [
    "psycopg2-binary>=2.9"
]
mongodb = [
    "pymongo>=4.0"
]
faiss = [
    "faiss-cpu>=1.7"
]
stores = [
    "trackey[postgres]",
    "trackey[faiss]",
    "trackey[mongodb]",
]
all = [
    "trackey[detection]",
    "trackey[tracking]",
    "trackey[reid]",
    "trackey[face]",
    "trackey[stores]",
]
dev = [
    "pytest==8.0.0",
    "pytest-cov==5.0.0",
    "mypy==1.8.0",
    "ruff==0.3.0",
    "matplotlib==3.9.2",
    "tqdm==4.66.6",
    "jupyterlab",
    "notebook",
    "ipykernel",
    "black",
    "flake8"
]