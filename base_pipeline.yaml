scene:
  zones:
    - name: AreaA
      polygon:
        - [0.0,0.5] # top left
        - [1.0,0.5] # top right
        - [1.0,1.0] # buttom right
        - [0.0,1.0] # buttom left

      color: [255,0,0]

pipeline:
  - name: detectorA
    component: detector
    type: yolo
    params:
      weights: yolov8n.pt
  - name: trackerA
    component: tracker
    type: deepsort
    params:
      max_age: 30
  - name: spatial_analyzer
    component: spatial_context
  - name: people_counter
    component: analyzer
    type: counter
    zone: AreaA
    params:
      target_classes:
        - person
      metrics:
        - current
        - cumulative