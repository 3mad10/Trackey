scene:
  zones:
    - name: AreaA
      polygon:
        - [0.7,0.3] # zone top left
        - [1.0,0.3] # zone top right
        - [1.0,1.0] # zone buttom right
        - [0.7,1.0] # zone buttom left

      color: [255,0,0]

pipeline:
  - name: detectorA
    type: detector
    processor: yolo
    params:
      weights: yolov8n.pt
  - name: trackerA
    type: tracker
    processor: deepsort
    params:
      max_age: 4
      n_init: 3
      nms_max_overlap: 0.5
      max_cosine_distance: 0.3
      nn_budget: 100
  - name: spatial_analyzer
    type: spatial_context
  - name: people_counter
    type: analyzer
    processor: counter
    zone: AreaA
    params:
      target_classes:
        - person
        - car
      metrics:
        - current
        - cumulative